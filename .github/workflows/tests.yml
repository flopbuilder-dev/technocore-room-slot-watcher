name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependency
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile watch_room.py

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Dry run
        run: python watch_room.py test-room --dry-run

      - name: Proof dry run
        run: >-
          python watch_room.py --create-proof
          https://github.com/example/project
          0123456789abcdef0123456789abcdef01234567
          --dry-run

  verifier:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: verifier

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: verifier/pnpm-lock.yaml

      - name: Install verifier dependencies
        run: pnpm install --frozen-lockfile

      - name: Run compatibility and tampering tests
        run: pnpm test

      - name: Build static verifier
        run: pnpm run build:pages
